<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خطة التعلّم الأسبوعية للصفوف الأولية</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#17324d;--mut:#5d7186;--pri:#1f4e79;--pri2:#2c6aa0;--bd:#b9c6d4;--soft:#e8f0f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1823;--card:#16222f;--tx:#e6eef6;--mut:#9db0c3;--pri:#3b7bb3;--pri2:#5a9bd0;--bd:#33475b;--soft:#1d2d3d}}
:root[data-theme="dark"]{--bg:#0f1823;--card:#16222f;--tx:#e6eef6;--mut:#9db0c3;--pri:#3b7bb3;--pri2:#5a9bd0;--bd:#33475b;--soft:#1d2d3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;font-size:15px}
.wrap{max-width:1150px;margin:auto;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:9px 14px;background:var(--pri);color:#fff;font-weight:500}
button.alt{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
button.del{background:transparent;color:#c0392b;border:1px solid #c0392b;padding:5px 10px;font-size:13px}
#st{margin-inline-start:auto;color:var(--mut);font-size:13px}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.gov{font-size:13px;line-height:1.7;font-weight:500}
.logo{text-align:center;color:var(--pri2);font-weight:700;font-size:20px}
h1{text-align:center;font-size:21px;margin:14px 0}
.info{display:grid;grid-template-columns:110px 1fr;border:1px solid var(--pri);margin-bottom:14px}
.info>div{padding:7px 10px;border-bottom:1px solid var(--bd)}
.info .l{background:var(--pri);color:#fff;font-weight:700;text-align:center}
.info>div:nth-last-child(-n+2){border-bottom:0}
.grades{display:flex;gap:22px;flex-wrap:wrap}.grades label{display:flex;gap:6px;align-items:center}
.grades input{width:18px;height:18px}
input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:transparent;border:0;padding:6px;resize:vertical;outline:0}
input[type=text]:focus,textarea:focus{background:var(--soft)}
.wk{margin-bottom:16px;border:1px solid var(--pri);border-radius:8px;overflow:hidden}
.wh{display:flex;justify-content:space-between;align-items:center;background:var(--pri);color:#fff;padding:6px 12px;font-weight:700}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th{background:var(--soft);font-size:13px;padding:6px;border:1px solid var(--bd)}
td{border:1px solid var(--bd);padding:0;vertical-align:top}
td textarea{min-height:38px;height:38px}
.un{width:19%}
th.wc,td.wc{background:var(--pri);color:#fff;text-align:center;font-weight:700;width:90px;vertical-align:middle}
th.wc{border-color:var(--pri)}td.wc button{margin-top:6px;font-size:12px;padding:4px 8px}
tr.first td{border-top:3px solid var(--pri)}
.sig{display:flex;justify-content:space-between;gap:20px;margin-top:18px;flex-wrap:wrap}
.sig label{display:flex;gap:8px;align-items:center;flex:1;min-width:240px;font-weight:700}
.sig input{border-bottom:1px dotted var(--bd)}
.vb{background:#fff3cd;color:#664d03;border:1px solid #e0c36a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vb[hidden]{display:none}.ro .wc button,.ro #addw{display:none}
#ov{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}#ov[hidden]{display:none}
#ovb{background:var(--card);border-radius:12px;max-width:620px;width:100%;max-height:80vh;overflow:auto;padding:16px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.it small{color:var(--mut);display:block}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;color:#000}.bar,button,#st{display:none!important}
 .wrap{padding:0;max-width:none}.sheet{border:0;padding:0}
 .wk{break-inside:avoid}.sc{overflow:visible}table{min-width:0}
 textarea{resize:none;overflow:hidden}
}
</style>
</head>
<body>
<div id="ov" hidden><div id="ovb"></div></div>
<div class="wrap">
 <div class="bar">
  <button id="addw" onclick="addWeek()">+ إضافة أسبوع</button>
  <button class="alt" onclick="exp('print')">🖨️ طباعة / PDF</button>
  <button class="alt" onclick="exp('html')">📄 تصدير Word (HTML)</button>
  <button class="alt" onclick="exp('csv')">📊 تصدير Excel (CSV)</button>
  <button class="alt" onclick="exp('json')">💾 نسخة احتياطية</button>
  <button class="alt" onclick="document.getElementById('imp').click()">📥 استيراد</button>
  <button class="alt" onclick="openDash()" id="dashb" hidden>👩‍💼 لوحة المديرة</button>
  <button class="alt" onclick="clr()">🗑️ مسح الكل</button>
  <input type="file" id="imp" accept=".json" hidden>
  <span id="st">الحفظ تلقائي</span>
 </div>
 <div id="vb" class="vb" hidden></div>
 <div class="sheet" id="sheet">
  <div class="head">
   <div class="gov">المملكة العربية السعودية<br>وزارة التعليم<br>الإدارة العامة للتعليم بمنطقة عسير<br>الشؤون التعليمية - إدارة الطفولة المبكرة<br>قسم الصفوف الأولية</div>
   <div class="logo">وزارة التعليم<br><small>Ministry of Education</small></div>
  </div>
  <h1>خطة التعلُّم الأسبوعية للصفوف الأولية</h1>
  <div class="info">
   <div class="l">اسم المدرسة</div><div><input type="text" id="school"></div>
   <div class="l">الصف</div><div class="grades" id="grades"></div>
  </div>
  <div id="weeks"></div>
  <div class="sig">
   <label>اسم معلمة المادة: <input type="text" id="teacher"></label>
   <label>مديرة المدرسة: <input type="text" id="principal"></label>
  </div>
 </div>
</div>
<script>
const KEY='weekly_plan_v1',COLS=['day','subj','lesson','skills','hw'],ROWS=6,GR=['أول ابتدائي','ثاني ابتدائي','ثالث ابتدائي'];
const H=['اليوم / التاريخ','المادة','الدرس','المهارات المستهدفة','الواجب المنزلي'];
let DB=null,UID=null,ADMIN=false,VIEW=null,MY=null;
let S=load(),tm;
function blank(){return{rows:Array.from({length:ROWS},()=>COLS.map(()=>'')),un:''}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.weeks)return d}catch(e){}
 return{school:'',teacher:'',principal:'',grade:[],weeks:Array.from({length:5},blank)}}
function save(){if(VIEW)return;clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(DB&&UID){DB.doc('plans/'+UID).set({json:JSON.stringify(S),teacher:S.teacher||'',school:S.school||'',updated:new Date().toISOString()}).then(()=>st('تم الحفظ في قاعدة البيانات ✓')).catch(()=>st('تعذّر الحفظ في القاعدة'))}else st('تم الحفظ على هذا الجهاز ✓')},300)}
function st(t){document.getElementById('st').textContent=t}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 school.value=S.school;teacher.value=S.teacher;principal.value=S.principal;
 grades.innerHTML=GR.map((g,i)=>`<label><input type="checkbox" ${S.grade.includes(i)?'checked':''} onchange="tg(${i},this.checked)">${g}</label>`).join('');
 weeks.innerHTML=`<div class="sc"><table><thead><tr><th class="wc">الأسبوع</th>${H.map(h=>`<th>${h}</th>`).join('')}<th class="un">المهارات غير المتحققة</th></tr></thead><tbody>${S.weeks.map((w,wi)=>w.rows.map((r,ri)=>`<tr class="${ri==0?'first':''}">${ri==0?`<td rowspan="${w.rows.length}" class="wc">الأسبوع ${wi+1}<br><button class="alt" onclick="addRow(${wi})">+ سطر</button><br><button class="del" onclick="delWeek(${wi})">حذف</button></td>`:''}${r.map((c,ci)=>`<td><textarea data-w="${wi}" data-r="${ri}" data-c="${ci}">${esc(c)}</textarea></td>`).join('')}${ri==0?`<td rowspan="${w.rows.length}" class="un"><textarea style="height:100%;min-height:240px" data-w="${wi}" data-u="1">${esc(w.un)}</textarea></td>`:''}</tr>`).join('')).join('')}</tbody></table></div>`;
}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.u)S.weeks[d.w].un=t.value;else if(d.r!==undefined)S.weeks[d.w].rows[d.r][d.c]=t.value;
 else if(['school','teacher','principal'].includes(t.id))S[t.id]=t.value;else return;
 st('جارٍ الحفظ...');save()});
function tg(i,v){S.grade=S.grade.filter(x=>x!==i);if(v)S.grade.push(i);save()}
function addWeek(){if(VIEW)return;S.weeks.push(blank());save();render();scrollTo(0,document.body.scrollHeight)}
function delWeek(i){if(VIEW)return;if(confirm('حذف هذا الأسبوع؟')){S.weeks.splice(i,1);save();render()}}
function addRow(i){if(VIEW)return;S.weeks[i].rows.push(COLS.map(()=>''));save();render()}
function clr(){if(VIEW)return;if(confirm('سيتم مسح جميع البيانات. هل أنتِ متأكدة؟')){S=load.call(0,localStorage.removeItem(KEY));S=load();render();save()}}
function table(){return `<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;width:100%"><tr style="background:#1f4e79;color:#fff"><th>الأسبوع</th>${H.map(h=>`<th>${h}</th>`).join('')}<th>المهارات غير المتحققة</th></tr>${S.weeks.map((w,i)=>w.rows.map((r,ri)=>`<tr>${ri==0?`<td rowspan="${w.rows.length}" style="background:#1f4e79;color:#fff;text-align:center">الأسبوع ${i+1}</td>`:''}${r.map(c=>`<td>${esc(c).replace(/\n/g,'<br>')}</td>`).join('')}${ri==0?`<td rowspan="${w.rows.length}">${esc(w.un).replace(/\n/g,'<br>')}</td>`:''}</tr>`).join('')).join('')}</table>`}
async function exp(type){
 let data,name,mime;
 if(type=='json'){data=JSON.stringify(S);name='الخطة-الأسبوعية.json';mime='application/json'}
 else if(type=='csv'){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[['الأسبوع',...H,'المهارات غير المتحققة'].map(q).join(',')];
  S.weeks.forEach((w,i)=>w.rows.forEach((r,ri)=>L.push(['الأسبوع '+(i+1),...r,ri==0?w.un:''].map(q).join(','))));
  data='\ufeff'+L.join('\r\n');name='الخطة-الأسبوعية.csv';mime='text/csv'}
 else{const g=S.grade.map(i=>GR[i]).join('، ');
  data=`<html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>body{font-family:Arial}@page{size:A4 landscape;margin:10mm}td,th{font-size:12px}</style></head><body>${type=='print'?'<script>onload=function(){setTimeout(function(){print()},500)}<\/script>':''}<p style="text-align:center">المملكة العربية السعودية - وزارة التعليم - الإدارة العامة للتعليم بمنطقة عسير<br>الشؤون التعليمية - إدارة الطفولة المبكرة - قسم الصفوف الأولية</p><h2 style="text-align:center">خطة التعلُّم الأسبوعية للصفوف الأولية</h2><p>اسم المدرسة: ${esc(S.school)} &nbsp; | &nbsp; الصف: ${esc(g)}</p>${table()}<p>اسم معلمة المادة: ${esc(S.teacher)} &nbsp;&nbsp;&nbsp; مديرة المدرسة: ${esc(S.principal)}</p></body></html>`;name='الخطة-الأسبوعية.html';mime='text/html'}
 try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data:new Blob([data],{type:mime+';charset=utf-8'})})}
 catch(e){if(e&&e.code=='declined')return;alert('التصدير غير متاح هنا. افتحي الرابط في متصفح عادي (Chrome أو Safari) ثم جرّبي مرة أخرى.')}
}
imp.onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.weeks)throw 0;S=d;render();save()}catch(x){alert('ملف غير صالح')}})};
function ro(){document.body.classList.toggle('ro',!!VIEW);document.querySelectorAll('input[type=text],textarea').forEach(e=>e.readOnly=!!VIEW);document.querySelectorAll('#grades input').forEach(e=>e.disabled=!!VIEW)}
async function openDash(){const o=document.getElementById('ov'),b=document.getElementById('ovb');o.hidden=false;b.innerHTML='جارٍ التحميل...';
 try{const q=await DB.collection('plans').get();const L=q.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.teacher||'').localeCompare(y.teacher||'','ar'));
 b.innerHTML='<h3 style="margin-top:0">خطط المعلمات ('+L.length+')</h3>'+(L.length?L.map(x=>`<div class="it"><div>${esc(x.teacher||'بدون اسم')}<small>${esc(x.school||'')} · آخر تحديث ${x.updated?new Date(x.updated).toLocaleDateString('ar-SA'):''}</small></div><button onclick="viewPlan('${x.id}')">عرض</button></div>`).join(''):'لا توجد خطط بعد.')+'<p><button class="alt" onclick="ov.hidden=true">إغلاق</button></p>'}
 catch(e){b.innerHTML='تعذّر تحميل الخطط.<p><button class="alt" onclick="ov.hidden=true">إغلاق</button></p>'}}
async function viewPlan(id){try{const d=await DB.doc('plans/'+id).get();if(!d.exists)return;if(!VIEW)MY=S;S=JSON.parse(d.data().json);VIEW=id;ov.hidden=true;render();ro();
 const v=document.getElementById('vb');v.hidden=false;v.innerHTML='أنتِ تعرضين خطة: <b>'+esc(S.teacher||'')+'</b> (للقراءة والتصدير فقط) <button class="alt" onclick="backMine()">رجوع لخطتي</button>'}catch(e){alert('تعذّر فتح الخطة')}}
function backMine(){S=MY||load();VIEW=null;MY=null;vb.hidden=true;render();ro()}
(async()=>{try{DB=await claude.use('db');const u=await claude.use('user');if(!DB||!u){DB=null;return}
 UID=await u.id();ADMIN=await u.canEdit();if(ADMIN)dashb.hidden=false;
 if(UID){const d=await DB.doc('plans/'+UID).get();if(d.exists&&d.data().json){S=JSON.parse(d.data().json);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else save();st('متصل بقاعدة البيانات ✓')}}catch(e){DB=null}})();
render();
</script>
</body>
</html>
